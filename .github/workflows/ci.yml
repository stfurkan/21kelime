name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run check
      - run: npm test
      - run: npm run build
      # Drives real Chrome through a full 21-round day against the built
      # site. It was never wired up here, which is how a suite that failed
      # on 43% of days went unnoticed for weeks.
      - name: End-to-end
        run: |
          npm run preview &
          for i in $(seq 1 60); do
            curl -sf http://localhost:4173/ >/dev/null && break
            sleep 1
          done
          npm run test:e2e
